services:
  rag-service:
    container_name: rag_service
    build: . 
    network_mode: "host"
    volumes:
      - ./:/app
    # env_file:
    #   - .env
    environment:
      RAG_PORT: 4545
      RAG_GUNICORN_WORKERS: 2
      PYTHONDONTWRITEBYTECODE: 1
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    dns:
      - 8.8.8.8
      - 8.8.4.4